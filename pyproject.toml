[project]
name = "call-me-maybe"
version = "0.1.0"
description = "42/Codam Call Me Maybe constrained function-calling project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.20.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.flake8]
exclude = [".git", ".venv", "__pycache__", ".mypy_cache", "data/output"]
max-line-length = 88

[tool.mypy]
exclude = ["^\\.venv/", "^data/output/", "^llm_sdk/"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true
